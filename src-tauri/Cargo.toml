[package]
name = "even-shoshan-search"
version = "0.1.5"
description = "Find words in the Even-Shoshan concordance"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
