name: Build and release

# Pull requests: build Windows + macOS installers and attach them to the run as artifacts.
# Tags like v0.1.0: build the same installers and publish them as a GitHub release.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (and publish the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Even-Shoshan Search ${{ github.ref_name }}"
          releaseBody: |
            Installers for Windows (.msi / -setup.exe) and macOS (universal .dmg, Apple Silicon and Intel).
            The concordance PDF is not included: on first launch, click "Open concordance PDF…" and choose your copy.
            macOS: the app is not signed. If macOS says it is damaged or can't be opened, run
            `xattr -cr "/Applications/Even-Shoshan Search.app"` once, or right-click the app and choose Open.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep installers as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
